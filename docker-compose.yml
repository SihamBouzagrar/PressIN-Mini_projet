version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_DB: pressin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Siham
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pressin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend Spring Boot
  app:
    build: .
    container_name: pressin-app
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pressin_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Siham
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "true"
      GROQ_API_KEY: ${GROQ_API_KEY}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Frontend avec Nginx
  frontend:
    build: ./frontend
    container_name: frontend-nginx
    ports:
      - "86:80"
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: